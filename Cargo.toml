[package]
name = "doraivu"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
crossterm = "0.29.0"
directories = "5.0.1"
futures-util = "0.3.34"
image = "0.25.10"
open = "5.4.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
reqwest = { version = "0.12.5", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokio = { version = "1.38.0", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util"] }
urlencoding = "2.1.3"
